<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

```
<meta name="description" content="404 Page Not Found">

<title>404 - Page Not Found</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, Helvetica, sans-serif;
    }

    body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
        background: #1f2937;
        color: #ffffff;
    }

    .card {
        width: 100%;
        max-width: 600px;
        padding: 50px 40px;
        text-align: center;
        background: #374151;
        border-radius: 15px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
    }

    h1 {
        font-size: 80px;
        line-height: 1;
        color: #ff5252;
        margin-bottom: 15px;
    }

    h2 {
        margin-bottom: 20px;
        font-size: 32px;
        color: #ffffff;
    }

    p {
        color: #d1d5db;
        font-size: 16px;
        line-height: 1.6;
        margin-bottom: 10px;
    }

    .home-button {
        display: inline-block;
        margin-top: 25px;
        padding: 12px 25px;
        background: #3b82f6;
        color: #ffffff;
        border-radius: 8px;
        text-decoration: none;
        font-weight: bold;
        transition: background-color 0.3s ease,
                    transform 0.2s ease;
    }

    .home-button:hover {
        background: #2563eb;
        transform: translateY(-2px);
    }

    .home-button:focus-visible {
        outline: 3px solid #ffffff;
        outline-offset: 4px;
    }

    .home-button:active {
        transform: translateY(0);
    }

    @media (max-width: 600px) {
        .card {
            padding: 40px 25px;
        }

        h1 {
            font-size: 64px;
        }

        h2 {
            font-size: 26px;
        }

        p {
            font-size: 15px;
        }
    }

    @media (prefers-reduced-motion: reduce) {
        .home-button {
            transition: none;
        }

        .home-button:hover {
            transform: none;
        }
    }
</style>
```

</head>

<body>

```
<main class="card" aria-labelledby="error-title">

    <h1 id="error-title">404</h1>

    <h2>Page Not Found</h2>

    <p>
        Sorry, the page you are looking for doesn't exist,
        has been moved, or is temporarily unavailable.
    </p>

    <a
        href="index.html"
        class="home-button"
        aria-label="Go back to the home page"
    >
        Go Back Home
    </a>

</main>
```

</body>
</html>
