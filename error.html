<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:#1f2937;
            color:white;
        }

        .card{
            text-align:center;
            background:#374151;
            padding:50px;
            border-radius:15px;
            box-shadow:0 10px 20px rgba(0,0,0,.4);
            max-width:600px;
        }

        h1{
            font-size:80px;
            color:#ff5252;
        }

        h2{
            margin:20px 0;
            font-size:32px;
        }

        p{
            color:#d1d5db;
            line-height:1.6;
        }

        a{
            display:inline-block;
            margin-top:30px;
            background:#3b82f6;
            color:white;
            padding:12px 25px;
            border-radius:8px;
            text-decoration:none;
            transition:.3s;
        }

        a:hover{
            background:#2563eb;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>404</h1>

    <h2>Page Not Found</h2>

    <p>
        Sorry, the page you are looking for doesn't exist or has been moved.
    </p>

    <a href="index.html">Go Back Home</a>
</div>

</body>
</html>
